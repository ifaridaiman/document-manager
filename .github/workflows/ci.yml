# Checks every PR and every push to main. release.yml also calls it (workflow_call)
# with the version being released, so a release ships exactly the tarballs built and
# smoke-tested here. Runs with a read-only token; never sees publishing credentials.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # release-please.yml dispatches this for its release PRs
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the packages (defaults to npm/pdf-engine/package.json)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Modules are verified and tidy
        run: |
          go mod verify
          go mod tidy -diff
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The engine tests are integration tests: real PDFs through PDFium (wasm).
      - name: Test (race detector, coverage)
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  npm:
    name: npm (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26] # package.json engines: >=22
    defaults:
      run:
        working-directory: npm/pdf-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm/pdf-engine/package-lock.json
      - run: npm ci # fails if package-lock.json is out of sync
      - name: Type-check index.js against index.d.ts
        run: npm run typecheck
      - run: npm run build:local
      - name: Wrapper tests (spawns the real engine)
        run: npm test

  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: npm/pdf-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/pdf-engine/package-lock.json
      - run: npm ci
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=${INPUT_VERSION:-$(node -p 'require("./package.json").version')}" >> "$GITHUB_OUTPUT"
      - name: Cross-compile all platforms
        run: npm run build
      - name: Build, pack and verify the six packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: npm run prepare-release -- "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: |
            npm/dist/tarballs/
            npm/dist/release/
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke (${{ matrix.target }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: # every platform we publish, each on native hardware
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: win32-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: pkgs
      - name: Install the tarballs into a fresh project and use them
        env:
          VERSION: ${{ needs.package.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dev() { node -p "require('./npm/pdf-engine/package.json').devDependencies['$1']"; }
          ts=$(dev typescript); types=$(dev @types/node)
          mkdir smoke-consumer
          cp npm/pdf-engine/test/smoke/* npm/pdf-engine/test/fixture.js smoke-consumer/
          cd smoke-consumer
          npm install --no-audit --no-fund \
            "../pkgs/tarballs/documentmanager-pdf-engine-$VERSION.tgz" \
            "../pkgs/tarballs/documentmanager-pdf-engine-$TARGET-$VERSION.tgz" \
            "typescript@$ts" "@types/node@$types"
          node smoke.mjs
          npx --no-install tsc -p .
