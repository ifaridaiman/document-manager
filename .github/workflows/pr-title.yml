# PRs are squash-merged, so the PR title becomes the commit Release Please reads to
# pick the next version and write the changelog. Separate from ci.yml so editing a
# title re-runs only this check.
name: pr-title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|chore|ci|build|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'fix(engine): handle empty pages' or 'feat!: drop Node 22'. Got: $TITLE"
            exit 1
          fi
